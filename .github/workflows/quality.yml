name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: HTML validation
        run: npx html-validate "*.html" --formatter stylish

      - name: JSON and facts-manifest validation
        run: node scripts/validate.mjs

      - name: Kit integrity
        run: node scripts/check-kit.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        run: node test/browser-checks.mjs

      - name: Lighthouse budgets
        if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'lighthouse')
        run: npx lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/tsw-shots/
          retention-days: 7

      - name: Secret scan
        run: |
          set -euo pipefail
          version="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1 \
            -c .gitleaks.toml
